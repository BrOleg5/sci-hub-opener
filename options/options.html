<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title data-i18n="optionsTitle">Sci-Hub PDF Opener</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <main>
    <section>
      <h2 data-i18n="optMirrorHeading">Mirror</h2>
      <div id="mirror-list" class="mirror-list"></div>
      <label class="mirror-row custom-row">
        <input type="radio" name="mirror" id="mirror-custom" value="custom">
        <span data-i18n="optCustomMirror">Custom:</span>
        <input type="text" id="custom-mirror" placeholder="sci-hub.example" spellcheck="false">
        <span class="status" id="status-custom"></span>
      </label>
      <div class="actions">
        <button id="check-mirrors" data-i18n="optCheckMirrors">Check availability</button>
        <span id="check-note" class="note"></span>
      </div>
    </section>

    <section>
      <h2 data-i18n="optMirrorListHeading">Mirror list</h2>
      <p class="note" data-i18n="optMirrorListHint">One domain per line.</p>
      <textarea id="mirrors-text" rows="8" spellcheck="false"></textarea>
      <div class="actions">
        <button id="save-mirrors" data-i18n="optSaveList">Save list</button>
        <button id="reset-mirrors" data-i18n="optResetList">Reset to defaults</button>
      </div>
    </section>

    <section>
      <h2 data-i18n="optBehaviorHeading">Behaviour</h2>
      <label class="row">
        <span data-i18n="optOpenIn">Open PDF in</span>
        <select id="open-in">
          <option value="newTab" data-i18n="optOpenInNewTab">new tab</option>
          <option value="currentTab" data-i18n="optOpenInCurrentTab">current tab</option>
        </select>
      </label>
      <label class="row">
        <input type="checkbox" id="show-badge">
        <span data-i18n="optShowBadge">Show "DOI" badge on the toolbar icon when a DOI is found</span>
      </label>
      <label class="row">
        <span data-i18n="optTimeout">Request timeout, seconds</span>
        <input type="number" id="timeout" min="3" max="120" step="1">
      </label>
    </section>

    <section>
      <h2 data-i18n="optTestHeading">Test</h2>
      <div class="row">
        <input type="text" id="test-doi" placeholder="10.1016/j.cell.2015.02.028" spellcheck="false">
        <button id="test-open" data-i18n="optTestOpen">Open in Sci-Hub</button>
      </div>
      <p class="note" data-i18n="optShortcutHint">Keyboard shortcut can be changed in Add-ons Manager → gear → Manage Extension Shortcuts.</p>
    </section>

    <p id="saved" class="saved" data-i18n="optSaved">Saved</p>
  </main>
  <script src="../lib/doi.js"></script>
  <script src="../lib/settings.js"></script>
  <script src="options.js"></script>
</body>
</html>
