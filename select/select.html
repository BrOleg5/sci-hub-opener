<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Sci-Hub PDF Opener</title>
  <link rel="stylesheet" href="select.css">
</head>
<body>
  <header>
    <h1 data-i18n="selectHeading">Select articles to open in Sci-Hub</h1>
    <p id="page" class="page"></p>
  </header>

  <div id="list" class="list"></div>
  <p id="empty" class="empty" data-i18n="selectEmpty" hidden>No articles found on this page.</p>

  <footer>
    <button id="select-all" data-i18n="selectAll">Select All</button>
    <button id="deselect-all" data-i18n="selectNone">Deselect All</button>
    <span class="spacer"></span>
    <button id="cancel" data-i18n="selectCancel">Cancel</button>
    <button id="open" class="primary" data-i18n="selectOpen" disabled>Open</button>
  </footer>

  <script src="select.js"></script>
</body>
</html>
